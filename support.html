<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PlugIt Support</title>

  <meta
    name="description"
    content="Contact PlugIt Support."
  />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background: #f7f7f9;
      color: #1d1d1f;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    p {
      color: #6e6e73;
      line-height: 1.6;
    }

    a.button {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;

      background: #007aff;
      color: #ffffff;

      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0d0d0f;
        color: #f5f5f7;
      }

      .card {
        background: #1c1c1e;
      }

      p {
        color: #a1a1a6;
      }
    }
  </style>

  <script>
    window.onload = function () {
      window.location.href =
        "mailto:support@yourdomain.com?subject=PlugIt%20Support";
    };
  </script>
</head>

<body>
  <main class="card">
    <h1>PlugIt Support</h1>

    <p>
      Your email application should open automatically.
    </p>

    <p>
      If it doesn't, click the button below.
    </p>

    <a
      class="button"
      href="mailto:jbstreaming02@gmail.com?subject=PlugIt%20Support"
    >
      Contact Support
    </a>
  </main>
</body>
</html>
